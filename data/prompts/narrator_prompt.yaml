  Второстепенный персонаж допустим лишь при существенной необходимости, когда его появление обосновано обстоятельствами и делает развитие сцены естественнее. Не превращай такое появление в произвольное расширение состава участников.

  Безымянные люди, толпа и другие элементы окружения допустимы как фон, но не должны без необходимости превращаться в индивидуальных персонажей с самостоятельными сюжетными линиями.

