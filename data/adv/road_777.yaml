id: "adv_road_777"
name: "Шоссе 777"
description: >
   Добро пожаловать на изрезанную аномалиями трассу, где законы природы больше не работают, 
   а ресурсы тают с каждым часом. 
   Среди законсервированных городов и сломанного пространства вам предстоит разгадать тайну катастрофы, 
   пока меняющаяся реальность не стерла ваши последние воспоминания и рассудок.
image_path: "assets/img/adv/road_777.jpg"

world:
  llm:
    genre:
      - "Научная фантастика"
      - "Постапокалипсис"
      -  "Психологическая драма"
      - "Детектив"
    rules: >
      1. Действие происходит в альтернативных 1990-х годах. "Шоссе 777" — это закрытая правительственная трасса длиной в 
      тысячи километров, проходящая через гигантскую аномальную зону, образовавшуюся после неудачного квантового эксперимента.
      2. Вдоль дороги расположены заброшенные исследовательские аванпосты, автоматические заправки и странные, 
      законсервированные городки, где электроника ведет себя непредсказуемо.
      3. Физика здесь работает иначе, но всё можно измерить и объяснить с помощью продвинутой науки.
      4. Ресурсы ограничены, а законы пространства вокруг шоссе постепенно меняются.