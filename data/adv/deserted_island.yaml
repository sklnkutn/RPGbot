id: "deserted_island"
name: "Черный прилив"
description: >
   Выброшенные на берег необитаемого острова, вы ищете способ выжить и выбраться. 
   Но с каждым приливом берег меняется, а на песке появляются следы тех, кто здесь не живёт.
image_path: "assets/img/adv/deserted_island.jpg"

world:
  llm:
    genre:
      - "Приключение"
      - "Выживание"
      - "Психологическая драма"
      - "Изоляция"
    rules: >
      1.Место действия — удалённый необитаемый остров; внешней помощи нет. 
      2.Вода, пища, укрытие, здоровье и инструменты ограничены; действия требуют времени и сил. 
      3.Погода, приливы, рельеф и живые организмы подчиняются правдоподобной природной логике. 
      4.Остров исследуем, но не раскрывает тайны без улик, наблюдений и экспериментов. 
      5.Не вводи спасение, удобные находки или сверхъестественные ответы без причин. 