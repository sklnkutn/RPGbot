id: "infinity_train"
name: "Поездка без конца"
description: >
   Поезд идёт сквозь ночь, поезд кажется безжизненным, бесконечным от начала до конца.
   Выясните, что происходит, прежде чем поезд решит, кем вы были до посадки.
image_path: "assets/img/adv/infinity_train.jpg"

world:
  llm:
    genre:
      - "Сюрреалистичная загадка"
      - "камерный мистический триллер"
      - "Изоляция"
    rules: >
      1.Основное пространство — бесконечный поезд с разными вагонами, который постоянно движется и не останавливается.
      2.Игрок и персонажи могут перемещатся  внутри поезда между вагонами но не могут из него выйти.
      3.Аномалии следуют повторяемым, обнаружимым закономерностям. 
      4.Остров исследуем, но не раскрывает тайны без улик, наблюдений и экспериментов. 
      5.Не объясняй загадку раньше времени и не меняй правила задним числом ради эффекта.